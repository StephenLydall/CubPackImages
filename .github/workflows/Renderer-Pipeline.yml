env:
  SHAREPOINT_FOLDER: "Stephen"
  WORKBOOK_NAME: "Member Database SP.xlsx"
  WORKBOOK_PATH: "Stephen/Member%20Database%20SP.xlsx"

name: Cub Pack Renderer Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  render:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Microsoft Graph Access Token
        id: token
        run: |
          TOKEN=$(curl -s -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.AZURE_CLIENT_SECRET }}" \
            -d "scope=https://graph.microsoft.com/.default" \
            -d "grant_type=client_credentials" \
            "https://login.microsoftonline.com/${{ secrets.AZURE_TENANT_ID }}/oauth2/v2.0/token" | jq -r '.access_token')
          echo "TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Get Microsoft Site ID
        run: |
          SITE_ID=$(curl -s \
            -H "Authorization: Bearer $TOKEN" \
            "https://graph.microsoft.com/v1.0/sites/solvdesignstudio.sharepoint.com:/sites/solvdesign" \
            | jq -r '.id')
          echo "SITE_ID=$SITE_ID" >> $GITHUB_ENV

      - name: Find Documents Drive
        run: |
          DRIVE_ID=$(curl -s \
            -H "Authorization: Bearer $TOKEN" \
            "https://graph.microsoft.com/v1.0/sites/$SITE_ID/drives" \
            | jq -r '.value[] | select(.name=="Documents") | .id')

          echo "DRIVE_ID=$DRIVE_ID" >> $GITHUB_ENV

      - name: Get current workbook ETag
        run: |
          ETAG=$(curl -s \
            -H "Authorization: Bearer $TOKEN" \
            "https://graph.microsoft.com/v1.0/drives/$DRIVE_ID/root:/${WORKBOOK_PATH}:" \
            | jq -r '.eTag')

          echo "CURRENT_ETAG=$ETAG" >> $GITHUB_ENV
          echo "Current ETag: $ETAG"

      - name: Check if workbook changed
        id: etagcheck
        run: |

          if [ -f ".last_etag" ]; then
            LAST_ETAG=$(cat .last_etag)
          else
            LAST_ETAG=""
          fi

          echo "Last ETag:    $LAST_ETAG"
          echo "Current ETag: $CURRENT_ETAG"

          if [ "$LAST_ETAG" = "$CURRENT_ETAG" ]; then
            echo "Workbook unchanged."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Workbook changed."
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Download Workbook
        if: steps.etagcheck.outputs.changed == 'true'
        run: |
          curl -L \
            -H "Authorization: Bearer $TOKEN" \
            "https://graph.microsoft.com/v1.0/drives/$DRIVE_ID/root:/${WORKBOOK_PATH}:/content" \
            --output "${WORKBOOK_NAME}"
            
      - name: Verify workbook
        if: steps.etagcheck.outputs.changed == 'true'
        run: |
          ls -lh "${WORKBOOK_NAME}"

      - name: Setup Python
        if: steps.etagcheck.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        if: steps.etagcheck.outputs.changed == 'true'
        run: pip install -r requirements.txt

      - name: Run update pipeline
        if: steps.etagcheck.outputs.changed == 'true'
        run: python update_keys.py
        
      - name: Save latest ETag
        if: steps.etagcheck.outputs.changed == 'true'
        run: |
          echo "$CURRENT_ETAG" > .last_etag
        
      - name: Commit generated files
        if: steps.etagcheck.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated render update"
            git push
          fi
