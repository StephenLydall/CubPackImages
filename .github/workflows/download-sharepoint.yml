name: Download SharePoint Workbook

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Microsoft Graph Access Token
        id: token
        run: |
          TOKEN=$(curl -s -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.AZURE_CLIENT_SECRET }}" \
            -d "scope=https://graph.microsoft.com/.default" \
            -d "grant_type=client_credentials" \
            "https://login.microsoftonline.com/${{ secrets.AZURE_TENANT_ID }}/oauth2/v2.0/token" | jq -r '.access_token')

          echo "TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Get SharePoint Site ID
        run: |
          SITE_ID=$(curl -s \
            -H "Authorization: Bearer $TOKEN" \
            "https://graph.microsoft.com/v1.0/sites/solvdesignstudio.sharepoint.com:/sites/solvdesign" \
            | jq -r '.id')

          echo "Site ID: $SITE_ID"

          echo "SITE_ID=$SITE_ID" >> $GITHUB_ENV

      - name: Find Documents Drive
        run: |
          DRIVE_ID=$(curl -s \
            -H "Authorization: Bearer $TOKEN" \
            "https://graph.microsoft.com/v1.0/sites/$SITE_ID/drives" \
            | jq -r '.value[] | select(.name=="Documents") | .id')

          echo "Drive ID: $DRIVE_ID"

          echo "DRIVE_ID=$DRIVE_ID" >> $GITHUB_ENV

      - name: List Stephen Folder
        run: |
          curl -s \
            -H "Authorization: Bearer $TOKEN" \
            "https://graph.microsoft.com/v1.0/drives/$DRIVE_ID/root:/Stephen:/children"
